services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: panbot-lavalink
    restart: unless-stopped
    environment:
      _JAVA_OPTIONS: '-Xmx1G'
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-logs:/opt/Lavalink/logs
    ports:
      - '2333:2333'

volumes:
  lavalink-logs:
